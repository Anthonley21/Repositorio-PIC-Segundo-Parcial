<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Heladería</title>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
    <script type="text/babel" data-type="module">
        import React from "https://esm.sh/react@19.2.0?dev";
        import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

        const menu = (
            <>
                <main>
                    <h1>La Heladería</h1>
                    <article className="menu-item" aria-labelledby="flavor-mora">
                        <img src="mora.svg" alt="Helado de mora silvestre" className="photo" />
                        <h2 id="flavor-mora">Mora silvestre</h2>
                        <p className="menu-item-description">
                            Mora de Ambato con un toque de limón.
                        </p>
                    </article>

                    <article className="menu-item" aria-labelledby="flavor-zapallo">
                        <h2 id="flavor-zapallo">Zapallo</h2>
                        <p className="menu-item-description">
                            Zapallo originario de Manabí
                        </p>
                    </article>

                    <section>
                        <label htmlFor="description">Descripción</label>
                        <input 
                            id="description" 
                            maxLength="120" 
                            readOnly 
                            className="field" 
                        />
                    </section>
                </main>
                <footer>
                    <p>La Heladería — Ambato</p>
                </footer>
            </>
        );

        createRoot(document.getElementById("root")).render(menu); 
    </script> 
</body>
</html>
