<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
    <script type="text/babel" data-type="module">
        import React from "https://esm.sh/react@19.2.0?dev";
        import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

        const menu = (
            <>
                <main>
                    <h1>La Heladería</h1>
                    <article className="menu-item" aria-labelledby="flavor-mora">
                        <h2 id="flavor-1">Mora silvestre</h2>
                        <p className="menu-item-description">
                        Mora de Ambato con un toque de limón.
                        </p>
                    </article>
                    <img src="mora.svg" alt="Helado de mora silvestre" className="photo"/>
                    <label htmlFor="description">Descripción</label>
                    <input id="description" maxLength="120" readOnly className="field" />
                </main>
                <footer>
                    <p>La Heladería — Ambato</p>
                </footer>
            </>
        );
        createRoot(document.getElementById("root")).render(menu); 
    </script> 
</body>
</html>
